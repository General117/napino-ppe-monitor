<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PPE Compliance Monitor</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <div class="brand-title"><span id="site">Napino Auto</span> &middot; <span id="camera">SMT Gallery 2</span></div>
    </div>
    <nav class="tabs">
      <button class="tab active" data-tab="live">Live</button>
      <button class="tab" data-tab="settings">Settings</button>
    </nav>
    <div class="topbar-right">
      <span id="live" class="live off"><i></i><b>Connecting</b></span>
      <span id="clock" class="clock">--:--:--</span>
    </div>
  </header>

  <!-- ============================== LIVE ============================== -->
  <main id="tab-live" class="layout">
    <div id="banner" class="banner" hidden></div>

    <section class="feed-card">
      <div class="feed"><img id="feed" src="/stream.mjpg" alt="Live camera feed"></div>
      <div class="legend">
        <span><i class="dot full"></i>Full PPE</span>
        <span><i class="dot partial"></i>Partial PPE</span>
        <span><i class="dot none"></i>No PPE</span>
        <span><i class="dot pending"></i>Verifying</span>
      </div>
    </section>

    <aside class="side">
      <div class="card">
        <h3>Today</h3>
        <div class="tiles">
          <div class="tile none"><b id="t-none">0</b><span>No PPE</span></div>
          <div class="tile partial"><b id="t-partial">0</b><span>Partial PPE</span></div>
          <div class="tile full"><b id="t-full">0</b><span>Full PPE</span></div>
        </div>
      </div>
      <div class="card">
        <h3>Status</h3>
        <dl class="sys">
          <dt>Camera</dt><dd id="s-camera">-</dd>
          <dt>Email alerts</dt><dd id="s-email">-</dd>
        </dl>
      </div>
    </aside>

    <section class="card incidents">
      <h3>Recent incidents</h3>
      <div id="incidents" class="incident-list"><span class="muted">None yet</span></div>
    </section>
  </main>

  <!-- ============================== SETTINGS ============================== -->
  <main id="tab-settings" class="settings" hidden>
    <section class="card">
      <h3>Alert recipients</h3>
      <ul id="rcpt-list" class="rcpt-list"></ul>
      <div class="row-form">
        <input id="rcpt-new" type="email" placeholder="name@company.com" autocomplete="off">
        <button id="rcpt-add" class="btn">Add</button>
      </div>
      <div class="actions">
        <button id="rcpt-save" class="btn primary">Save recipients</button>
        <span id="rcpt-msg" class="msg"></span>
      </div>
    </section>

    <section class="card">
      <h3>Sender email</h3>
      <div id="smtp-state" class="state"></div>
      <form id="smtp-form" class="form" autocomplete="off">
        <label>Email address<input id="smtp-address" type="email" autocomplete="off"></label>
        <label>App password<input id="smtp-password" type="password" autocomplete="new-password"></label>
        <div class="actions">
          <button type="submit" class="btn primary">Sign in</button>
          <button type="button" id="smtp-test" class="btn">Send test email</button>
          <button type="button" id="smtp-out" class="btn ghost">Sign out</button>
          <a id="smtp-link" class="link" target="_blank" rel="noopener">Get an App password &#8599;</a>
        </div>
        <span id="smtp-msg" class="msg"></span>
      </form>
    </section>

    <section class="card">
      <h3>Camera (NVR)</h3>
      <div id="nvr-state" class="state"></div>
      <form id="nvr-form" class="form" autocomplete="off">
        <label>NVR address<input id="nvr-ip" autocomplete="off"></label>
        <label>User name<input id="nvr-user" autocomplete="off"></label>
        <label>Password<input id="nvr-password" type="password" autocomplete="new-password"></label>
        <label>Channel<input id="nvr-channel" type="number" min="1" max="64"></label>
        <div class="actions">
          <button type="submit" class="btn primary">Connect</button>
          <button type="button" id="nvr-out" class="btn ghost">Sign out</button>
          <a id="nvr-link" class="link" target="_blank" rel="noopener">Open NVR login page &#8599;</a>
        </div>
        <span id="nvr-msg" class="msg"></span>
      </form>
    </section>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-body">
      <img id="modal-img" alt="Incident screenshot">
      <div id="modal-caption" class="modal-caption"></div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
